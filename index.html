<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>NAMUHX · 함께 선물하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet" />
<style>
  :root {
    --bg-stage: #f1f2f4;
    --bg-page: #f5f5f7;
    --card: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #424245;
    --ink-3: #6e6e73;
    --ink-4: #a1a1a6;
    --line: #e8e8ed;
    --line-2: #f0f0f3;

    --mint: #4FC9B5;
    --mint-deep: #2EA993;
    --mint-soft: #e8f8f4;
    --mint-tint: #d5f1ea;
    --navy: #0a1f44;
    --navy-soft: #1a2f54;

    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --coin: #fbbf24;
    --party: #ec4899;
    --sky: #38bdf8;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg-stage);
    color: var(--ink);
    overflow-x: hidden;
    letter-spacing: -0.012em;
  }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  #root { width: 100%; display: flex; align-items: center; justify-content: center; }

  /* ── Phone scroll scrollbar reset ── */
  .pscroll { scrollbar-width: none; }
  .pscroll::-webkit-scrollbar { display: none; }

  /* ── Common utility ── */
  .num { font-feature-settings: "tnum" 1, "ss01" 1; }
  .glass {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }
  .glass-dark {
    background: rgba(20,20,22,0.62);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes gentle-pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.04); opacity: 1; }
  }
  @keyframes ring-fill {
    from { stroke-dasharray: 0 1000; }
  }
  @keyframes sticker-bounce {
    0% { transform: translateY(8px) scale(0.9); opacity: 0; }
    60% { transform: translateY(-4px) scale(1.06); }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes confetti-fall {
    0% { transform: translate3d(0,-20px,0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(var(--cx, 0), 480px, 0) rotate(720deg); opacity: 0; }
  }
  @keyframes shimmer {
    0% { background-position: -240px 0; }
    100% { background-position: 240px 0; }
  }
  @keyframes slideRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideLeft {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
  }

  .anim-fadeUp { animation: fadeUp .5s cubic-bezier(.2,.7,.3,1) both; }
  .anim-fadeIn { animation: fadeIn .4s ease both; }
  .anim-pop { animation: pop .5s cubic-bezier(.2,.7,.3,1) both; }
  .anim-float { animation: float 3.2s ease-in-out infinite; }

  /* ── Tap feedback ── */
  .tap { transition: transform .15s cubic-bezier(.2,.7,.3,1), background .15s, box-shadow .15s; cursor: pointer; }
  .tap:active { transform: scale(0.97); }

  /* ── Stage backdrop ── */
  .stage-grid {
    background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
  }
</style>

<!-- React 18 + Babel -->

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel" src="screens-host.jsx"></script>
<script type="text/babel" src="screens-guest.jsx"></script>
<script type="text/babel" src="prototype.jsx"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
